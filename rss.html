<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veille Technologique - Monib Mellouk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            indigo: '#6366f1',
                            cyan: '#06b6d4',
                            yellow: '#fbbf24',
                            dark: '#0f172a'
                        }
                    }
                },
            },
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @import "tailwindcss";

        .hacker-grid {
            background-image: radial-gradient(circle at 2px 2px, rgba(99, 102, 241, 0.05) 1px, transparent 0);
            background-size: 40px 40px;
        }

        .dark .hacker-grid {
            background-image: radial-gradient(circle at 2px 2px, rgba(99, 102, 241, 0.1) 1px, transparent 0);
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .dark .glass-nav {
            background: rgba(15, 23, 42, 0.8);
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(99, 102, 241, 0.1);
            position: fixed;
            z-index: 100;
            pointer-events: none;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .cyber-border {
            position: relative;
        }

        .cyber-border::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 20px;
            height: 20px;
            border-bottom: 2px solid #6366f1;
            border-right: 2px solid #6366f1;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 hacker-grid min-h-screen">
    <div class="scanline"></div>

    <!-- Navbar -->
    <header class="fixed top-0 w-full z-50 glass-nav border-b border-indigo-600/30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex-shrink-0">
                    <a href="/" class="text-xl font-black group font-mono flex items-center gap-2">
                        <div class="w-8 h-8 bg-indigo-600 flex items-center justify-center text-white shadow-lg">
                            <i data-lucide="arrow-left" class="w-5 h-5"></i>
                        </div>
                        <span class="text-slate-900 dark:text-white">Retour</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-yellow-400 transition-colors">
                        <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                        <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="pt-32 pb-20 px-6">
        <div class="max-w-7xl mx-auto">
            <div class="mb-16 reveal active">
                <h1 class="text-5xl md:text-7xl font-black mb-4 uppercase tracking-tighter">Flux_Actualités_Complet</h1>
                <p class="text-xs font-mono text-indigo-600 uppercase tracking-[0.4em]">Veille_Technologique_Temps_Réel</p>
            </div>

            <div id="rss-full-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Loading State -->
                <div class="animate-pulse space-y-4">
                    <div class="h-64 bg-slate-200 dark:bg-slate-800 rounded"></div>
                    <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-3/4"></div>
                    <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-1/2"></div>
                </div>
                <div class="animate-pulse space-y-4">
                    <div class="h-64 bg-slate-200 dark:bg-slate-800 rounded"></div>
                    <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-3/4"></div>
                    <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-1/2"></div>
                </div>
                <div class="animate-pulse space-y-4">
                    <div class="h-64 bg-slate-200 dark:bg-slate-800 rounded"></div>
                    <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-3/4"></div>
                    <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-1/2"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-12 border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <p class="text-[10px] font-mono text-slate-500 uppercase tracking-widest">© 2026 Mellouk-Monib.portefolio // Veille Technologique</p>
        </div>
    </footer>

    <script>
        function updateIcons() {
            if (window.lucide) {
                lucide.createIcons();
            }
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
            updateIcons();
        }

        if (localStorage.theme === 'dark' || (!localStorage.theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('active');
            });
        }, { threshold: 0.1 });

        async function fetchFullRSS() {
            const container = document.getElementById('rss-full-container');
            if (!container) return;
            
            const feeds = [
                "https://www.google.fr/alerts/feeds/07441877953152607055/4850682426371101381",
                "https://www.google.fr/alerts/feeds/07441877953152607055/16576091909060437112",
                "https://www.google.fr/alerts/feeds/07441877953152607055/13323225299678454321",
                "https://www.google.fr/alerts/feeds/07441877953152607055/3319127203902968987"
            ];

            // Show loading state
            container.innerHTML = `
                <div class="animate-pulse space-y-4">
                    <div class="h-64 bg-slate-200 dark:bg-slate-800 rounded"></div>
                    <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-3/4"></div>
                    <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-1/2"></div>
                </div>
                <div class="animate-pulse space-y-4">
                    <div class="h-64 bg-slate-200 dark:bg-slate-800 rounded"></div>
                    <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-3/4"></div>
                    <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-1/2"></div>
                </div>
                <div class="animate-pulse space-y-4">
                    <div class="h-64 bg-slate-200 dark:bg-slate-800 rounded"></div>
                    <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-3/4"></div>
                    <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-1/2"></div>
                </div>
            `;

            try {
                const feedPromises = feeds.map(async (url) => {
                    const fallbackUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`;
                    const response = await fetch(fallbackUrl);
                    if (!response.ok) throw new Error('Fetch failed');
                    const data = await response.json();
                    if (data.status !== 'ok') throw new Error('RSS data error');
                    
                    return data.items.map(item => ({
                        title: item.title.replace(/<[^>]*>?/gm, ''),
                        link: item.link,
                        pubDate: item.pubDate,
                        contentSnippet: item.description.replace(/<[^>]*>?/gm, '').slice(0, 250) + '...',
                        image: item.thumbnail || item.enclosure?.link || "",
                        source: data.feed.title.replace("Alerte Google - ", "")
                    }));
                });

                const results = await Promise.allSettled(feedPromises);
                let allItems = [];
                results.forEach(result => {
                    if (result.status === 'fulfilled') {
                        allItems = [...allItems, ...result.value];
                    }
                });

                // Sort and take top 20
                const sortedItems = allItems
                    .sort((a, b) => new Date(b.pubDate).getTime() - new Date(a.pubDate).getTime())
                    .slice(0, 20);

                if (sortedItems.length === 0) {
                    container.innerHTML = '<p class="text-slate-500 font-mono text-sm col-span-full text-center p-20">Aucun article trouvé pour le moment.</p>';
                    return;
                }

                container.innerHTML = sortedItems.map(item => `
                    <a href="${item.link}" target="_blank" class="group block bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-indigo-500 transition-all overflow-hidden shadow-xl hover:shadow-indigo-500/10 reveal">
                        ${item.image ? `
                        <div class="relative h-64 overflow-hidden">
                            <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" referrerPolicy="no-referrer">
                            <div class="absolute top-4 left-4">
                                <span class="px-3 py-1 bg-indigo-600 text-white text-[10px] font-mono uppercase tracking-widest shadow-lg">${item.source}</span>
                            </div>
                        </div>
                        ` : `
                        <div class="p-8 pb-0">
                            <span class="px-3 py-1 bg-indigo-600 text-white text-[10px] font-mono uppercase tracking-widest shadow-lg">${item.source}</span>
                        </div>
                        `}
                        <div class="p-8">
                            <p class="text-[10px] font-mono text-slate-500 mb-3 uppercase tracking-widest">${new Date(item.pubDate).toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' })}</p>
                            <h4 class="text-lg font-bold font-mono text-slate-900 dark:text-white mb-4 line-clamp-2 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors uppercase leading-tight">${item.title}</h4>
                            <p class="text-xs font-mono text-slate-500 dark:text-slate-400 line-clamp-4 leading-relaxed">${item.contentSnippet || ''}</p>
                            <div class="mt-6 flex items-center text-indigo-600 dark:text-indigo-400 text-[10px] font-mono uppercase tracking-widest font-bold">
                                Lire l'article <i data-lucide="external-link" class="w-3 h-3 ml-2"></i>
                            </div>
                        </div>
                    </a>
                `).join('');
                
                container.querySelectorAll('.reveal').forEach(el => observer.observe(el));
                updateIcons();
            } catch (error) {
                console.error('RSS Error:', error);
                container.innerHTML = `
                    <div class="col-span-full text-center p-20 bg-red-500/5 border border-red-500/20 rounded-lg">
                        <p class="text-red-500 font-mono text-sm mb-6">Erreur lors du chargement direct du flux RSS.</p>
                        <button onclick="fetchFullRSS()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-mono text-xs uppercase tracking-widest transition-all shadow-lg">
                            Réessayer
                        </button>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateIcons();
            fetchFullRSS();
        });
    </script>
</body>
</html>
